<!DOCTYPE html>
<html lang="en">
<head>
    <title>Visibility</title>
    <style>
        .box{
            height:50px;
            width:50px;

        }

        #box1{
            background-color:blue;
            visibility:hidden;
        }
        #box2{
            background-color:green;
            visibility:visible;
        }
    </style>

</head>
<body>
    <h1>Shapes</h1>
    <div id="box1" class="box">Square1</div><br>
    <div id="box2" class="box">Square2</div>
    
</body>
</html>
