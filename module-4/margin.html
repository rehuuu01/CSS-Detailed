<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Margin property</title>
    <style>
       
        .pad{
        background-color:blue;
        height:50px;
        width:50px;
    }
    #pad1{
        margin:10px 10px 10px 10px;
    }
    #pad2{
        margin:90px 20px 20px 200px;
    }
    </style>
</head>
<body>
    <div id="pad1" class="pad">Box 1</div>
    <div id="pad2" class="pad">Box 2</div>

    
</body>
</html>
