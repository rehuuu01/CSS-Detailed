<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Border Radius</title>
    <style>
        .box{
            height:100px;
            width:100px;
            background-color:blue;
            margin:10px 10px 10px 10px;
        }
        #box1{
            border-radius:20px;
        }
        #box2{
            border-radius:50%;
        }
    </style>
</head>
<body>
    <!--Border radius -->
    <div id="box1" class="box">Box 1</div>
    <div id="box2" class="box">Box 2</div>

    
</body>
</html>
