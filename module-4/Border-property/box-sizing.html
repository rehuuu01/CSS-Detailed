<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Box sizing</title>
    <style>
        button{
            height:100px;
            width:100px;
            background-color: aquamarine;
            border: 5px solid black;
        }
            #btn1{
                box-sizing: content-box;
            }
            #btn2{
                box-sizing: border-box;
        }
    </style>
</head>
<body>
    <button id="btn1">Box Sizing</button><br>
    <button id="btn2">Box Sizing</button>
    
</body>
</html>
