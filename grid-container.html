<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>   Grid

    </title>
    <style>
        *{
            margin:0;
            padding:0;

        }
        .box{
            height: 100px;
            width:100px;
            border:3px solid black;
            margin-right:5px;
            background-color: burlywood;
        }
        #heading{margin-left:200px;}
        #container{
            height:500px;
            width:500px;
            border:3px solid black;
            padding:10px;
            margin:20px;
            background-color: darkkhaki;

            display:grid;
            justify-content: center;
            align-content: center;
           grid-template-columns: 100px 100px;
           grid-template-rows: 100px 100px;
           
            
            
        }
        #box2{
           background-color: bisque;
           grid-row: 2/2;
           grid-column: 1/2;
          
        }
         #box1{
           background-color:crimson;
           grid-row: 1/2;
           grid-column: 2/2;
          
         
        }
         #box3{
           background-color: bisque;
           grid-row: 1/2;
           grid-column: 1/2;
          
         
        } #box4{
           background-color:brown;
           grid-row: 2/2;
           grid-column: 2/2;
          
          
        }

    </style>
</head>
<body>
    <h1 id="heading">Grid container </h1>
    <div id="container">
        <div id="box1" class="box">Flex Item1</div>
         <div id="box2" class="box" >Flex Item2</div>
          <div id="box3" class="box">Flex Item3</div>
           <div id="box4" class="box">Flex Item4</div>
           
    </div>

    
</body>
</html>
