<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Float property</title>
    <style>
        #container{
            height:200px;
            width:500px;
            background-color: bisque;
            border:2px solid black;

        }
        #box1{
            background-color: black;
            height:150px;
            width:150px;
            margin:5px;
            border:5px solid brown;
            float:right;

        }
        #box2{
            background-color: black;
            height:150px;
            width:150px;
            margin:5px;
            border:5px solid brown;
            float:left;
        }
        .box{
            border-radius: 50%;
        }
       

    </style>
</head>
<body>
    <div id="container">
        <div id="box1" class="box"></div>
<div id="box2" class="box"></div>

    </div>
   
    
</body>
</html>
