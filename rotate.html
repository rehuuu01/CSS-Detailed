<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>CSS Transform</title>
    <style>
        .box{
            height:50px;
            width:50px;
            background-color: bisque;
            border-radius: 10px;
            border: 2px solid black;
            position:relative;
            top:50px;
            left:100px;
            margin:10px;

            transition: all 0.5s ease-in;
          

        }
        #bt1:hover{
            transform: rotate(45deg);

        }
        #bt2:hover{
            transform: rotatex(45deg);
        }
       
    </style>
</head>
<body>
    <div  id="bt1" class="box" >Rotate</div>
     <div id="bt2"  class="box">Rotate</div>
    
</body>
</html>
