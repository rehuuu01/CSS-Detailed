<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Text Decoration</title>
    <style>
        .text{
            background-color:blue;
            height:70px;
            width:100px;
        }
        #text1{
            text-decoration:underline;
        }
        #text2{
            text-decoration:overline;
        }
        #text3{
            text-decoration:line-through;
        }
       #link{
        text-decoration:none;
       }
       #text4{
        text-decoration-style: dashed;
       }
       .box{
        text-decoration:overline;
       }
       #text5{
        text-decoration-style: double;
       }
       #text6{
        text-decoration-style: wavy;
       }

    </style> 
</head>
<body>
    <div id="text1" class="text">Underline</div><br>
    <div id="text2" class="text">Overline</div><br>
    <div id="text3" class="text">Line-through</div><br>
    <div id="text4" class="box">Dashed</div><br>
    <div id="text5" class="box">double</div><br>
    <div id="text6" class="box">wavy</div><br>
    <a  id="link" href="#">This is a link</a>
</body>
</html>
