<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Text Align</title>
    <style>
        .box{
            height:100px;
            width:100px;
            background-color:blue;
        }
        #box1{
            text-align:left;
        }
        #box2{
            text-align:center;
        }
        #box3{
            text-align:right;
        }
    </style>
</head>
<body>
    <div  id="box1" class="box">
        Text-Align
    </div><br>
    <div id="box2" class="box">
        Text-Align
    </div><br>
    <div id="box3" class="box">
        Text-Align
    </div>
    
</body>
</html>
