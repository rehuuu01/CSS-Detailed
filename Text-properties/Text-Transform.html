<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Text Transformation</title>
    <style>
        #head1{
            text-transform:uppercase;
        }
        #head2{
            text-transform:lowercase;
        }
        #head3{
            text-transform:capitalize;
        }
        #head4{
            text-transform:none;
        }
    </style>
</head>
<body>
    <h1 id="head1">Text Transformation</h1>
     <h1 id="head2">Text Transformation</h1>
      <h1 id="head3">Text Transformation</h1>
       <h1 id="head4">Text Transformation</h1>

    
</body>
</html>
