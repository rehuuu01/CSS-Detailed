<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>CSS Transform</title>
    <style>
        .box{
            height:80px;
            width:80px;
            background-color: bisque;
            border-radius: 10px;
            border: 2px solid black;
            position:relative;
            top:50px;
            left:100px;
            margin:10px;

            transition: all 0.5s ease-in;
          

        }
        #bt1:hover{
            transform: skew(45deg);

        }
        #bt2:hover{
            transform: skew(220deg);
        }
        #bt3:hover{
            transform: skewy(45deg);
        }
       
    </style>
</head>
<body>
    <div  id="bt1" class="box" >Skew</div>
     <div id="bt2"  class="box">Skew</div>
      <div id="bt3"  class="box">skew</div>
    
</body>
</html>
