 <!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Animation</title>
    <style>
        .box{
            height:80px;
            width:80px;
            background-color: bisque;
            border-radius: 10px;
            border: 2px solid black;
            position:relative;
            top:10px;
            left:10px;
            margin:10px;
            padding:5px;

            /* animation-name: moved;
            animation-duration: 2s;
            animation-timing-function: ease-in-out;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-direction:alternate; */ 

            animation: moved 2s ease-in-out 1s infinite alternate;

        }
        @keyframes moved {
            0%{left:10px;

            }
            50%{left:150px}
            100%{left:200px;

            }
            
        }
        
       
    </style>
</head>
<body>
    <div  id="bt1" class="box" >Animate</div>
    
    
</body>
</html>
